name: Validate CI workflow YAML

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-ci-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate CI workflow YAML syntax
        run: pnpm run validate:ci-workflow
