name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  validate-scheduled-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Clerk job concurrency
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          workflow = Path(".github/workflows/ci.yml").read_text()
          jobs = {}
          current_job = None

          for line in workflow.splitlines():
              job_match = re.match(r"^  ([A-Za-z0-9_-]+):$", line)
              if job_match:
                  current_job = job_match.group(1)
                  jobs[current_job] = {
                      "uses_clerk": False,
                      "group": None,
                      "cancel_in_progress": None,
                  }
                  continue

              if current_job is None:
                  continue

              if re.match(r"^      CLERK_[A-Za-z0-9_]+:", line):
                  jobs[current_job]["uses_clerk"] = True
              elif re.match(r"^      group:", line):
                  jobs[current_job]["group"] = line.split(":", 1)[1].strip()
              elif re.match(r"^      cancel-in-progress:", line):
                  jobs[current_job]["cancel_in_progress"] = line.split(":", 1)[1].strip()

          clerk_jobs = {
              name: settings
              for name, settings in jobs.items()
              if settings["uses_clerk"]
          }

          if len(clerk_jobs) < 2:
              raise SystemExit(
                  "Expected at least two Clerk-using jobs, found "
                  f"{len(clerk_jobs)}: {', '.join(clerk_jobs) or 'none'}"
              )

          missing_concurrency = [
              name
              for name, settings in clerk_jobs.items()
              if settings["group"] is None
              or settings["cancel_in_progress"] is None
          ]
          if missing_concurrency:
              raise SystemExit(
                  "Clerk-using jobs must define concurrency settings: "
                  + ", ".join(missing_concurrency)
              )

          required_jobs = {"api-tests", "cleanup-abandoned-test-users"}
          missing_required_jobs = required_jobs - clerk_jobs.keys()
          if missing_required_jobs:
              raise SystemExit(
                  "Expected Clerk-using jobs are missing: "
                  + ", ".join(sorted(missing_required_jobs))
              )

          if (
              clerk_jobs["api-tests"]["group"]
              == clerk_jobs["cleanup-abandoned-test-users"]["group"]
          ):
              details = ", ".join(
                  f"{name}={settings['group']}"
                  for name, settings in clerk_jobs.items()
              )
              raise SystemExit(
                  "API tests and scheduled cleanup must use separate Clerk "
                  "concurrency groups: " + details
              )

          cancellation_enabled = [
              name
              for name, settings in clerk_jobs.items()
              if settings["cancel_in_progress"].lower() != "false"
          ]
          if cancellation_enabled:
              raise SystemExit(
                  "Clerk-using jobs must keep cancel-in-progress disabled: "
                  + ", ".join(cancellation_enabled)
              )

          print(
              "Validated Clerk concurrency for: "
              + ", ".join(clerk_jobs)
          )
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate scheduled cleanup environment
        run: pnpm --filter @workspace/api-server run validate:cleanup-workflow

  api-tests:
    if: github.event_name != 'schedule'
    concurrency:
      group: ${{ github.repository }}-clerk-api-test-environment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI_TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run disposable database and authenticated API tests
        run: pnpm --filter @workspace/api-server run test:ci

  database-runner-compatibility:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      # PostgreSQL 14 is the compatibility floor, 16 is the current CI baseline.
      # Keep this range aligned with the versions supported by the service.
      matrix:
        postgres-version: ["14", "15", "16"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI_TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      CI_TEST_DATABASE_VERSION: ${{ matrix.postgres-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database runner cleanup and isolation tests
        run: pnpm --filter @workspace/db run test

  cleanup-abandoned-test-users:
    if: github.event_name == 'schedule'
    needs: validate-scheduled-cleanup
    concurrency:
      group: ${{ github.repository }}-clerk-cleanup-test-environment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: web_irc_cleanup
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d web_irc_cleanup"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/web_irc_cleanup
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      TEAM_NOTIFICATION_WEBHOOK_URL: ${{ secrets.TEAM_NOTIFICATION_WEBHOOK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create disposable test schema
        run: env -u DATABASE_URL pnpm --filter @workspace/db run push:test

      - name: Remove abandoned test users
        run: >-
          env -u DATABASE_URL
          pnpm --filter @workspace/api-server run cleanup:test-users:scheduled
