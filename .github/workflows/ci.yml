name: CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  release-validation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release validation (typecheck, tests, builds, licenses)
        run: pnpm run release:validate

      - name: Build all workspace packages
        run: pnpm run build
        env:
          PORT: 4173
          BASE_PATH: /web-irc/

  validate-scheduled-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate CI workflow YAML syntax
        run: pnpm run validate:ci-workflow

      - name: Validate Clerk job concurrency
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci -p 'test_*.py'
          python3 scripts/ci/validate_clerk_concurrency.py .github/workflows/ci.yml

      - name: Validate PostgreSQL CI version policy
        run: python3 scripts/ci/validate_postgres_versions.py .github/workflows/ci.yml

      - name: Validate scheduled cleanup environment
        run: pnpm --filter @workspace/api-server run validate:cleanup-workflow

  api-tests:
    if: github.event_name != 'schedule'
    name: Authenticated API tests (PostgreSQL ${{ matrix.postgres-version }})
    strategy:
      fail-fast: false
      # Keep matrix jobs sequential as they mutate the same Clerk test tenant.
      max-parallel: 1
      matrix:
        postgres-version: ["14", "15", "16"]
    concurrency:
      group: ${{ github.repository }}-clerk-api-test-environment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI_TEST_DATABASE_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
      CI_TEST_DATABASE_VERSION: ${{ matrix.postgres-version }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The migration rehearsal uses a reviewed fixture, not Git history.
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared library declarations
        run: pnpm run typecheck:libs

      - name: Check API types
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Run migration rehearsal, schema validation, and authenticated API tests
        run: pnpm --filter @workspace/api-server run test:ci

  database-runner-compatibility:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      # Versions are checked against scripts/ci/validate_postgres_versions.py.
      matrix:
        postgres-version: ["14", "15", "16"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI_TEST_DATABASE_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
      CI_TEST_DATABASE_VERSION: ${{ matrix.postgres-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify real schema bootstrap, database isolation, and cleanup
        run: |
          set +e
          pnpm --filter @workspace/db exec sh -c 'node --test --test-reporter=tap ./scripts/*.test.mjs' 2>&1 | tee "$RUNNER_TEST_OUTPUT"
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -ne 0 ]; then
            node lib/db/scripts/summarize-compatibility-tests.mjs "$RUNNER_TEST_OUTPUT"
          fi
          exit "$test_status"
        env:
          RUNNER_TEST_OUTPUT: ${{ runner.temp }}/database-runner-tests.tap

  cleanup-abandoned-test-users:
    if: github.event_name == 'schedule'
    needs: validate-scheduled-cleanup
    concurrency:
      group: ${{ github.repository }}-clerk-cleanup-test-environment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: web_irc_cleanup
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d web_irc_cleanup"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/web_irc_cleanup
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      TEAM_NOTIFICATION_WEBHOOK_URL: ${{ secrets.TEAM_NOTIFICATION_WEBHOOK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create disposable test schema
        run: env -u DATABASE_URL pnpm --filter @workspace/db run push:test

      - name: Remove abandoned test users
        run: >-
          env -u DATABASE_URL
          pnpm --filter @workspace/api-server run cleanup:test-users:scheduled
