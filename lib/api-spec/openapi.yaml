openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: irc
    description: IRC room and message operations
paths:
  /admin/custom-roles:
    get:
      operationId: listAdminCustomRoles
      summary: List custom role definitions and grantable permissions
      description: Only roles are paged; the grantable permissions catalog is unchanged. Cursor pages use immutable-key order and the initial ceiling excludes later inserts. Deleted roles are omitted; edits to role labels are reflected when each page is read. Changes to access or filtering that affect visibility can change later pages.
      parameters:
        - $ref: "#/components/parameters/CollectionLimit"
        - $ref: "#/components/parameters/CollectionOffset"
        - $ref: "#/components/parameters/CollectionCursor"
      responses:
        "200":
          description: Role catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomRoleCatalog"
    post:
      operationId: createAdminCustomRole
      summary: Create a reusable scoped role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomRoleInput"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomRole"
  /admin/custom-roles/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateAdminCustomRole
      summary: Edit a custom role and its permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomRoleInput"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomRole"
    delete:
      operationId: retireAdminCustomRole
      summary: Retire a custom role without deleting its history
      responses:
        "200":
          description: Retired
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /irc/state:
    get:
      operationId: getIrcState
      tags: [irc]
      summary: Get current IRC room state
      description: Returns the selected channel's recent messages and current nicknames.
      parameters:
        - name: channel
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: IRC room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrcState"
        "400":
          description: Invalid channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /irc/join:
    post:
      operationId: joinIrcChannel
      tags: [irc]
      summary: Join an IRC channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IrcJoinInput"
      responses:
        "200":
          description: Joined room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrcState"
        "400":
          description: Invalid join request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /irc/messages:
    post:
      operationId: sendIrcMessage
      tags: [irc]
      summary: Send a message to an IRC channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IrcMessageInput"
      responses:
        "201":
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IrcMessage"
        "400":
          description: Invalid message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /irc/events:
    get:
      operationId: streamIrcEvents
      tags: [irc]
      summary: Stream IRC room events
      description: Opens a server-sent events stream for messages and presence changes in a channel.
      parameters:
        - name: channel
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Server-sent events stream
          content:
            text/event-stream:
              schema:
                type: string
  /onboarding:
    get:
      operationId: getOnboardingState
      tags: [onboarding]
      summary: Get the authenticated user's onboarding state
      responses:
        "200":
          description: Onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /onboarding/{communityId}/progress:
    post:
      operationId: advanceOnboarding
      tags: [onboarding]
      summary: Advance onboarding for an owned community
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingProgressInput"
      responses:
        "200":
          description: Updated onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgress"
        "403":
          description: The user cannot manage this community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Community not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the signed-in user's notifications
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
          headers:
            X-Has-More:
              description: Whether another page is available.
              schema: { type: boolean }
            X-Next-Offset:
              description: Offset to use for the next page when X-Has-More is true.
              schema: { type: integer, minimum: 0 }
  /communities:
    get:
      operationId: listCommunities
      tags: [communities]
      summary: List accessible paid workspaces
      description: The JSON response remains an array. The named community parameters override the general limit and offset. Cursor pages use immutable community-ID order; the first cursor establishes a ceiling that excludes later inserts. Deleted communities are omitted and renamed communities are returned with their current names. Changes to membership, access, or filtering that affect visibility can change later pages.
      parameters:
        - $ref: "#/components/parameters/WorkspaceLimit"
        - $ref: "#/components/parameters/WorkspaceOffset"
        - name: communitiesLimit
          in: query
          description: Overrides limit for the communities array; values above 100 are capped.
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
        - name: communitiesOffset
          in: query
          description: Overrides offset for the communities array.
          schema: { type: integer, minimum: 0, maximum: 2147483647 }
        - name: cursor
          in: query
          description: Optional opaque cursor for the communities page; use start to begin cursor pagination.
          schema: { type: string }
        - name: communitiesCursor
          in: query
          description: Alias for cursor, scoped to the communities array. Supply only one of cursor and communitiesCursor.
          schema: { type: string }
      responses:
        "200":
          description: Page of paid workspaces
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
          headers:
            X-Has-More:
              description: Whether another page of workspaces is available.
              schema: { type: boolean }
            X-Next-Offset:
              description: Current offset plus the page limit (also sent on the final page).
              schema: { type: integer, minimum: 0 }
            X-Next-Cursor:
              $ref: "#/components/headers/ListNextCursor"
        "400":
          description: Invalid pagination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /communities/{communityId}:
    get:
      operationId: getCommunityWorkspace
      tags: [communities]
      summary: Get workspace data and bounded collection pages
      description: Named collection parameters override the general limit and offset. Collection limits above 100 are capped at 100. Each collection retains its existing array shape; pagination describes each page. Cursor pages use immutable-key order and each collection's initial ceiling excludes later inserts. Deleted records are omitted and renamed records are reflected at read time; membership, access, or filter changes can change visibility between pages.
      parameters:
        - name: communityId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/WorkspaceLimit"
        - $ref: "#/components/parameters/WorkspaceOffset"
        - name: employeesLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: employeesOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: employeesCursor
          in: query
          description: Optional opaque cursor for the employees collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: invitationsLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: invitationsOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: invitationsCursor
          in: query
          description: Optional opaque cursor for the invitations collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: tasksLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: tasksOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: tasksCursor
          in: query
          description: Optional opaque cursor for the tasks collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: channelsLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: channelsOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: channelsCursor
          in: query
          description: Optional opaque cursor for the channels collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: categoriesLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: categoriesOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: categoriesCursor
          in: query
          description: Optional opaque cursor for the categories collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: assignmentsLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: assignmentsOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: assignmentsCursor
          in: query
          description: Optional opaque cursor for the assignments collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: departmentsLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: departmentsOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: departmentsCursor
          in: query
          description: Optional opaque cursor for the departments collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: locationsLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: locationsOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: locationsCursor
          in: query
          description: Optional opaque cursor for the locations collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: teamsLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: teamsOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: teamsCursor
          in: query
          description: Optional opaque cursor for the teams collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: teamMembershipsLimit
          in: query
          description: Opt in to bounded membership pages for the selected employees; omitted retains the full array.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: teamMembershipsOffset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: teamMembershipsCursor
          in: query
          description: Optional opaque cursor for team memberships; membership changes can affect which rows are visible between pages.
          schema: { type: string }
        - name: policiesLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: policiesOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: policiesCursor
          in: query
          description: Optional opaque cursor for the policies collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: announcementsLimit
          in: query
          description: Overrides limit for announcements; the default is 20 when no general limit is supplied. Values above 100 are capped.
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
        - name: announcementsOffset
          in: query
          schema: { type: integer, minimum: 0, maximum: 2147483647 }
        - name: announcementsCursor
          in: query
          description: Optional opaque cursor for the announcements collection; use start to begin cursor pagination.
          schema: { type: string }
      responses:
        "200":
          description: Workspace data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityWorkspaceResponse" }
        "400":
          description: Invalid pagination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /communities/{communityId}/organization-snapshot:
    get:
      operationId: getOrganizationSnapshot
      tags: [communities]
      summary: Get only the organization directory collections for a workspace
      description: A matching If-None-Match header returns 304. Collection pages use the same bounded pagination as workspace details. Cursor pages use immutable-key order and each collection's initial ceiling excludes later inserts. Deleted records are omitted and renames are reflected at read time; membership or access changes can change visibility between pages.
      parameters:
        - name: communityId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/WorkspaceLimit"
        - $ref: "#/components/parameters/WorkspaceOffset"
        - name: employeesLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: employeesOffset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: employeesCursor
          in: query
          description: Optional opaque cursor for the employees collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: invitationsLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: invitationsOffset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: invitationsCursor
          in: query
          description: Optional opaque cursor for the invitations collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: assignmentsLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: assignmentsOffset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: assignmentsCursor
          in: query
          description: Optional opaque cursor for the assignments collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: departmentsLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: departmentsOffset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: departmentsCursor
          in: query
          description: Optional opaque cursor for the departments collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: locationsLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: locationsOffset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: locationsCursor
          in: query
          description: Optional opaque cursor for the locations collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: teamsLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: teamsOffset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: teamsCursor
          in: query
          description: Optional opaque cursor for the teams collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: teamMembershipsLimit
          in: query
          description: Opt in to bounded workspace membership pages; omitted retains complete memberships for the selected employees.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: teamMembershipsOffset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: teamMembershipsCursor
          in: query
          description: Optional opaque cursor for team memberships; membership changes can affect which rows are visible between pages.
          schema: { type: string }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Organization page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSnapshot" }
        "304":
          description: Organization page unchanged
        "400":
          description: Invalid pagination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Workspace not found or inaccessible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /communities/{communityId}/moderation-logs:
    get:
      operationId: listModerationLogs
      tags: [moderation]
      summary: List recent moderation actions
      parameters:
        - name: communityId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: Moderation actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModerationAction" }
          headers:
            X-Has-More:
              description: Whether another page is available.
              schema: { type: boolean }
            X-Next-Offset:
              description: Offset to use for the next page when X-Has-More is true.
              schema: { type: integer, minimum: 0 }
  /communities/{communityId}/activity:
    get:
      operationId: listCommunityActivity
      tags: [audit]
      summary: List workspace audit activity
      parameters:
        - name: communityId
          in: path
          required: true
          schema: { type: integer }
        - name: auditLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: auditOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: userId
          in: query
          schema: { type: string }
        - name: departmentId
          in: query
          schema: { type: integer }
        - name: locationId
          in: query
          schema: { type: integer }
        - name: action
          in: query
          schema: { type: string }
        - name: resource
          in: query
          schema: { type: string, maxLength: 120 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Workspace audit activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityActivityResponse" }
  /communities/{communityId}/documents:
    get:
      operationId: listCommunityDocuments
      tags: [documents]
      summary: List workspace documents and bounded document pages
      parameters:
        - name: communityId
          in: path
          required: true
          schema: { type: integer }
        - name: q
          in: query
          schema: { type: string }
        - name: folderId
          in: query
          schema: { type: integer }
        - name: category
          in: query
          schema: { type: string }
        - name: children
          in: query
          description: "Set to summary to return only the latest version and continuation metadata for versions and permissions; omitted retains complete child arrays."
          schema: { type: string, enum: [summary] }
        - name: documentsLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: documentsOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: foldersLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: foldersOffset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Workspace documents and related metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentListResponse" }
  /communities/{communityId}/documents/{documentId}:
    get:
      operationId: getCommunityDocument
      tags: [documents]
      summary: Read a document and optionally page its versions and permissions
      description: "Without child page parameters, returns complete child arrays for existing clients. Permissions are visible to managers only. Each child page has independent continuation metadata."
      parameters:
        - { name: communityId, in: path, required: true, schema: { type: integer } }
        - { name: documentId, in: path, required: true, schema: { type: integer } }
        - { name: versionsLimit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: versionsOffset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: permissionsLimit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: permissionsOffset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Document with versions and permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDetailResponse" }
        "400": { description: Invalid pagination }
        "404": { description: Document not found or inaccessible }
  /communities/{communityId}/tasks/{taskId}:
    get:
      operationId: getCommunityTask
      tags: [tasks]
      summary: Read a task and optionally page its comments and attachments
      description: "Without child page parameters, returns complete child arrays for existing clients."
      parameters:
        - { name: communityId, in: path, required: true, schema: { type: integer } }
        - { name: taskId, in: path, required: true, schema: { type: integer } }
        - { name: commentsLimit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: commentsOffset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: attachmentsLimit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: attachmentsOffset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Task with comments and attachments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetailResponse" }
        "400": { description: Invalid pagination }
        "404": { description: Task not found or inaccessible }
  /communities/{communityId}/teams/{teamId}/members:
    get:
      operationId: listCommunityTeamMembers
      tags: [communities]
      summary: Page members of a team in a business workspace
      parameters:
        - { name: communityId, in: path, required: true, schema: { type: integer } }
        - { name: teamId, in: path, required: true, schema: { type: integer } }
        - { name: membersLimit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: membersOffset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: Team members and continuation metadata, content: { application/json: { schema: { $ref: "#/components/schemas/TeamMembersResponse" } } } }
        "400": { description: Invalid pagination }
        "404": { description: Team not found or inaccessible }
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get administrative statistics and activity
      description: Channel and category pages are independent; collectionPagination reports the requested limit and offset and an approximate hasMore flag (true when a full page is returned). Cursor pages use immutable channel/category ID order, and each initial ceiling excludes later inserts. Deleted records are omitted and renamed records are reflected at read time; membership and access changes can change visibility between pages. Users and recent messages retain their existing shapes.
      parameters:
        - name: channelLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: channelOffset
          in: query
          schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
        - name: channelCursor
          in: query
          description: Optional opaque cursor for the channels collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: categoryLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: categoryOffset
          in: query
          schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
        - name: categoryCursor
          in: query
          description: Optional opaque cursor for the categories collection; use start to begin cursor pagination.
          schema: { type: string }
        - name: activityLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: activityOffset
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - name: activityCursor
          in: query
          schema: { type: string, maxLength: 256 }
        - name: activityAfterCursor
          in: query
          description: Return events newer than this activity cursor.
          schema: { type: string, maxLength: 256 }
        - name: activityActor
          in: query
          schema: { type: string, maxLength: 200 }
        - name: activityAction
          in: query
          schema: { type: string, maxLength: 200 }
        - name: activityStartDate
          in: query
          description: Inclusive UTC calendar date for the earliest activity to return; must be YYYY-MM-DD.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: activityEndDate
          in: query
          description: Inclusive UTC calendar date for the latest activity to return; must be YYYY-MM-DD.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Administrative overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/activity/check:
    get:
      operationId: checkAdminActivity
      tags: [admin]
      summary: Check for matching administrative activity
      description: Returns whether any activity newer than the optional cursor matches the supplied filters without loading the admin overview.
      parameters:
        - name: activityAfterCursor
          in: query
          description: Return true only for events newer than this activity cursor.
          schema: { type: string, maxLength: 256 }
        - name: activityActor
          in: query
          schema: { type: string, maxLength: 200 }
        - name: activityAction
          in: query
          schema: { type: string, maxLength: 200 }
        - name: activityStartDate
          in: query
          description: Inclusive UTC calendar date for the earliest activity to match; must be YYYY-MM-DD.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: activityEndDate
          in: query
          description: Inclusive UTC calendar date for the latest activity to match; must be YYYY-MM-DD.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Whether matching activity is available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminActivityCheckResponse" }
  /admin/activity/export:
    get:
      operationId: exportAdminActivity
      tags: [admin]
      summary: Download all matching administrative activity as CSV
      parameters:
        - name: activityActor
          in: query
          schema: { type: string, maxLength: 200 }
        - name: activityAction
          in: query
          schema: { type: string, maxLength: 200 }
        - name: activityStartDate
          in: query
          description: Inclusive UTC calendar date for the earliest activity to export; must be YYYY-MM-DD.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: activityEndDate
          in: query
          description: Inclusive UTC calendar date for the latest activity to export; must be YYYY-MM-DD.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: CSV containing every matching activity event
          content:
            text/csv:
              schema: { type: string }
          headers:
            Content-Disposition:
              description: Download filename for the CSV export.
              schema: { type: string }
        "400":
          description: Invalid filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Administrator access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List admin-visible users
      description: Cursor pages use immutable user-key order and the initial creation-time ceiling excludes later inserts. Deleted users are omitted and renamed users are reflected at read time; changes to filters or account visibility can change which rows match between pages.
      parameters:
        - $ref: "#/components/parameters/CollectionLimit"
        - $ref: "#/components/parameters/CollectionOffset"
        - $ref: "#/components/parameters/CollectionCursor"
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: role
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [online, offline] }
        - name: accountStatus
          in: query
          schema: { type: string, enum: [active, suspended] }
      responses:
        "200":
          description: Page of users, as an array
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
          headers:
            X-Next-Cursor: { $ref: "#/components/headers/ListNextCursor" }
  /admin/role-assignments:
    get:
      operationId: listAdminRoleAssignments
      tags: [admin]
      summary: List role assignments
      description: Cursor pages use immutable assignment-ID order and the initial creation-time ceiling excludes later inserts. Deleted assignments are omitted; joined names are reflected at read time, and changes to related membership or access can change visibility.
      parameters:
        - $ref: "#/components/parameters/CollectionLimit"
        - $ref: "#/components/parameters/CollectionOffset"
        - $ref: "#/components/parameters/CollectionCursor"
      responses:
        "200":
          description: Page of assignments, as an array
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
          headers:
            X-Next-Cursor: { $ref: "#/components/headers/ListNextCursor" }
  /admin/scope-options:
    get:
      operationId: listAdminScopeOptions
      tags: [admin]
      summary: List role scope options
      description: The same limit and offset are applied independently to each array; the JSON object and its array fields are unchanged. Each cursor-enabled array uses immutable ID order and its initial creation-time ceiling excludes later inserts. Deleted records are omitted and renames are reflected at read time. Changes to membership, access, or filtering that affect visibility can change later pages.
      parameters:
        - $ref: "#/components/parameters/CollectionLimit"
        - $ref: "#/components/parameters/CollectionOffset"
        - name: communitiesCursor
          in: query
          description: Optional opaque cursor for the communities array; use start to begin cursor pagination.
          schema: { type: string }
        - name: categoriesCursor
          in: query
          description: Optional opaque cursor for the categories array; use start to begin cursor pagination.
          schema: { type: string }
        - name: channelsCursor
          in: query
          description: Optional opaque cursor for the channels array; use start to begin cursor pagination.
          schema: { type: string }
        - name: departmentsCursor
          in: query
          description: Optional opaque cursor for the departments array; use start to begin cursor pagination.
          schema: { type: string }
      responses:
        "200":
          description: Paged scope option arrays
          content:
            application/json:
              schema:
                type: object
                required: [communities, categories, channels, departments]
                properties:
                  communities: { type: array, items: { type: object } }
                  categories: { type: array, items: { type: object } }
                  channels: { type: array, items: { type: object } }
                  departments: { type: array, items: { type: object } }
                  pagination:
                    type: object
                    properties:
                      communities:
                        type: object
                        required: [nextCursor]
                        properties:
                          nextCursor: { type: ["string", "null"] }
                      categories:
                        type: object
                        required: [nextCursor]
                        properties:
                          nextCursor: { type: ["string", "null"] }
                      channels:
                        type: object
                        required: [nextCursor]
                        properties:
                          nextCursor: { type: ["string", "null"] }
                      departments:
                        type: object
                        required: [nextCursor]
                        properties:
                          nextCursor: { type: ["string", "null"] }
  /developer/releases:
    get:
      operationId: listDeveloperReleases
      tags: [developer]
      summary: List developer releases
      parameters:
        - $ref: "#/components/parameters/CollectionLimit"
        - $ref: "#/components/parameters/CollectionOffset"
      responses:
        "200":
          description: Page of releases, as an array
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
  /channels:
    get:
      operationId: listChannels
      tags: [irc]
      summary: List visible channels
      description: Cursor pages use immutable channel-ID order with an initial ceiling that excludes later inserts. Deleted channels are omitted and renamed channels are reflected at read time; membership and access changes can change visibility between pages.
      parameters:
        - $ref: "#/components/parameters/IrcLimit"
        - $ref: "#/components/parameters/IrcOffset"
        - $ref: "#/components/parameters/CollectionCursor"
      responses:
        "200":
          description: Page of channels, as an array
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
          headers:
            X-Has-More: { $ref: "#/components/headers/ListHasMore" }
            X-Next-Offset: { $ref: "#/components/headers/ListNextOffset" }
            X-Next-Cursor: { $ref: "#/components/headers/ListNextCursor" }
  /channels/{channelId}/public-spaces:
    get:
      operationId: listChannelPublicSpaces
      tags: [irc]
      summary: List public spaces available to the channel owner
      description: Returns an array of eligible owned public communities, excluding the channel's current community. Cursor pages use immutable community-ID order with an initial ceiling that excludes later inserts. Deleted communities are omitted and renamed communities are reflected at read time; changes to ownership, eligibility, or access can change visibility between pages.
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/IrcLimit"
        - $ref: "#/components/parameters/IrcOffset"
        - $ref: "#/components/parameters/CollectionCursor"
      responses:
        "200":
          description: Page of eligible public spaces, as an array
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, plan]
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    plan: { type: string }
          headers:
            X-Has-More: { $ref: "#/components/headers/ListHasMore" }
            X-Next-Offset: { $ref: "#/components/headers/ListNextOffset" }
            X-Next-Cursor: { $ref: "#/components/headers/ListNextCursor" }
  /categories:
    get:
      operationId: listCategories
      tags: [irc]
      summary: List visible categories
      description: Cursor pages use immutable category-ID order with an initial ceiling that excludes later inserts. Deleted categories are omitted and renamed categories are reflected at read time; membership and access changes can change visibility between pages.
      parameters:
        - $ref: "#/components/parameters/IrcLimit"
        - $ref: "#/components/parameters/IrcOffset"
        - $ref: "#/components/parameters/CollectionCursor"
      responses:
        "200":
          description: Page of categories, as an array
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
          headers:
            X-Has-More: { $ref: "#/components/headers/ListHasMore" }
            X-Next-Offset: { $ref: "#/components/headers/ListNextOffset" }
            X-Next-Cursor: { $ref: "#/components/headers/ListNextCursor" }
  /users/search:
    get:
      operationId: searchUsers
      tags: [irc]
      summary: Search visible users
      description: Cursor pages use immutable user creation-time/ID order with an initial ceiling that excludes later inserts. Deleted users are omitted and changed names are read at continuation time; search-filter or visibility changes may add or remove matching users between pages.
      parameters:
        - $ref: "#/components/parameters/IrcLimit"
        - $ref: "#/components/parameters/IrcOffset"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/CollectionCursor"
      responses:
        "200":
          description: Page of users, as an array
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
          headers:
            X-Has-More: { $ref: "#/components/headers/ListHasMore" }
            X-Next-Offset: { $ref: "#/components/headers/ListNextOffset" }
            X-Next-Cursor: { $ref: "#/components/headers/ListNextCursor" }
  /dm/threads:
    get:
      operationId: listDmThreads
      tags: [irc]
      summary: List visible direct-message threads
      parameters:
        - $ref: "#/components/parameters/IrcLimit"
        - $ref: "#/components/parameters/IrcOffset"
      responses:
        "200":
          description: Page of threads, as an array
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
          headers:
            X-Has-More: { $ref: "#/components/headers/ListHasMore" }
            X-Next-Offset: { $ref: "#/components/headers/ListNextOffset" }
  /search/messages:
    get:
      operationId: searchMessages
      tags: [irc]
      summary: Search visible messages
      parameters:
        - $ref: "#/components/parameters/IrcLimit"
        - $ref: "#/components/parameters/IrcOffset"
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: Page of messages, as an array
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
          headers:
            X-Has-More: { $ref: "#/components/headers/ListHasMore" }
            X-Next-Offset: { $ref: "#/components/headers/ListNextOffset" }
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [irc]
      summary: List visible announcements
      parameters:
        - $ref: "#/components/parameters/IrcLimit"
        - $ref: "#/components/parameters/IrcOffset"
      responses:
        "200":
          description: Page of announcements, as an array
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
          headers:
            X-Has-More: { $ref: "#/components/headers/ListHasMore" }
            X-Next-Offset: { $ref: "#/components/headers/ListNextOffset" }
components:
  parameters:
    CollectionLimit:
      name: limit
      in: query
      description: Number of records to return.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    CollectionOffset:
      name: offset
      in: query
      description: Number of records to skip.
      schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
    CollectionCursor:
      name: cursor
      in: query
      description: Optional opaque cursor; use start to begin cursor pagination. Cursor pagination continues by this token instead of by offset; endpoint-specific validation rules apply.
      schema: { type: string }
    WorkspaceLimit:
      name: limit
      in: query
      description: Default limit for workspace collections; values above 100 are capped.
      schema: { type: integer, minimum: 1, maximum: 2147483647, default: 100 }
    WorkspaceOffset:
      name: offset
      in: query
      description: Default offset for workspace collections.
      schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
    IrcLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
    IrcOffset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 9007199254740991, default: 0 }
    SearchQuery:
      name: q
      in: query
      schema: { type: string, maxLength: 200 }
    PageLimit:
      name: limit
      in: query
      description: Maximum number of records to return. Values above 100 are capped.
      schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
    PageOffset:
      name: offset
      in: query
      description: Number of records to skip.
      schema: { type: integer, minimum: 0, default: 0 }
  headers:
    ListHasMore:
      description: Whether another page of visible results exists (not sent for too-short search queries).
      schema: { type: boolean }
    ListNextOffset:
      description: Offset for the next page when X-Has-More is true (omitted on the final page or for too-short search queries).
      schema: { type: integer, minimum: 0 }
    ListNextCursor:
      description: Opaque continuation cursor for the next page; omitted when cursor pagination is not requested or no further page exists.
      schema: { type: string }
  schemas:
    Notification:
      type: object
      required: [id, userId, type, category, body, createdAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        type: { type: string }
        category: { type: string }
        body: { type: string }
        communityId: { type: integer, nullable: true }
        entityType: { type: string, nullable: true }
        entityId: { type: string, nullable: true }
        actionUrl: { type: string, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        archivedAt: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ModerationAction:
      type: object
      required: [id, actorId, actorDisplayName, action, createdAt]
      properties:
        id: { type: integer }
        actorId: { type: string }
        actorDisplayName: { type: string, nullable: true }
        targetUserId: { type: string, nullable: true }
        communityId: { type: integer, nullable: true }
        channelId: { type: integer, nullable: true }
        action: { type: string }
        details: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    DocumentListResponse:
      type: object
      required: [folders, documents, canManage, pagination]
      properties:
        folders: { type: array, items: { type: object } }
        documents: { type: array, items: { type: object } }
        canManage: { type: boolean }
        pagination: { $ref: "#/components/schemas/PageInfo" }
        foldersPagination: { $ref: "#/components/schemas/PageInfo" }
    DocumentDetailResponse:
      type: object
      required: [id, versions]
      properties:
        id: { type: integer }
        versions: { type: array, items: { type: object } }
        permissions: { type: array, items: { type: object } }
        childrenPagination:
          type: object
          properties:
            versions: { $ref: "#/components/schemas/PageInfo" }
            permissions: { $ref: "#/components/schemas/PageInfo" }
    TaskDetailResponse:
      type: object
      required: [id, comments, attachments]
      properties:
        id: { type: integer }
        comments: { type: array, items: { type: object } }
        attachments: { type: array, items: { type: object } }
        childrenPagination:
          type: object
          properties:
            comments: { $ref: "#/components/schemas/PageInfo" }
            attachments: { $ref: "#/components/schemas/PageInfo" }
    TeamMembersResponse:
      type: object
      required: [members, pagination]
      properties:
        members: { type: array, items: { type: object } }
        pagination: { $ref: "#/components/schemas/PageInfo" }
    OrganizationSnapshot:
      type: object
      required: [members, employees, assignments, departments, locations, teams, teamMemberships, invitations, pagination]
      properties:
        members: { type: array, items: { type: object } }
        employees: { type: array, items: { type: object } }
        assignments: { type: array, items: { type: object } }
        departments: { type: array, items: { type: object } }
        locations: { type: array, items: { type: object } }
        teams: { type: array, items: { type: object } }
        teamMemberships: { type: array, items: { type: object } }
        invitations: { type: array, items: { type: object } }
        pagination:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PageInfo" }
    CommunityWorkspaceResponse:
      type: object
      required: [community, pagination]
      properties:
        community: { type: object }
        members: { type: array, items: { type: object } }
        channels: { type: array, items: { type: object } }
        categories: { type: array, items: { type: object } }
        assignments: { type: array, items: { type: object } }
        departments: { type: array, items: { type: object } }
        locations: { type: array, items: { type: object } }
        teams: { type: array, items: { type: object } }
        policies: { type: array, items: { type: object } }
        employees: { type: array, items: { type: object } }
        invitations: { type: array, items: { type: object } }
        tasks: { type: array, items: { type: object } }
        announcements: { type: array, items: { type: object } }
        pagination:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PageInfo" }
    PageInfo:
      type: object
      required: [limit, offset, hasMore]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
        nextCursor: { type: ["string", "null"], description: Opaque continuation cursor when cursor pagination is requested; null when complete. }
    AdminOverview:
      type: object
      required: [stats, users, channels, categories, collectionPagination, recentMessages, activity, activityPagination]
      properties:
        stats: { type: object }
        users: { type: array, items: { type: object } }
        channels: { type: array, items: { type: object } }
        categories: { type: array, items: { type: object } }
        collectionPagination:
          type: object
          required: [channels, categories]
          properties:
            channels: { $ref: "#/components/schemas/PageInfo" }
            categories: { $ref: "#/components/schemas/PageInfo" }
        recentMessages: { type: array, items: { type: object } }
        activity: { type: array, items: { type: object } }
        activityPagination: { $ref: "#/components/schemas/AdminActivityPagination" }
    AdminActivityPagination:
      type: object
      required: [limit, offset, hasMore, nextOffset, nextCursor, newestCursor, newerHasMore]
      properties:
        limit: { type: integer, minimum: 1, maximum: 50 }
        offset: { type: integer, minimum: 0 }
        hasMore: { type: boolean, description: Whether older events are available. }
        nextOffset: { type: ["integer", "null"], minimum: 0 }
        nextCursor: { type: ["string", "null"] }
        newestCursor: { type: ["string", "null"], description: Cursor for the newest returned event. }
        newerHasMore: { type: boolean, description: Whether more newer events remain after an activityAfterCursor request. }
    AdminActivityCheckResponse:
      type: object
      required: [hasNewActivity]
      properties:
        hasNewActivity: { type: boolean }
    AuditEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: integer }
        actorId: { type: string, nullable: true }
        actor: { type: string }
        action: { type: string }
        departmentId: { type: integer, nullable: true }
        locationId: { type: integer, nullable: true }
        resourceType: { type: string, nullable: true }
        resourceId: { type: string, nullable: true }
        targetLabel: { type: string, nullable: true }
        details: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CommunityActivityResponse:
      type: object
      required: [entries, actions, pagination]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        actions: { type: array, items: { type: string } }
        pagination: { $ref: "#/components/schemas/PageInfo" }
    CustomRoleInput:
      type: object
      required: [label, description, scopeType, permissions]
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 240 }
        scopeType: { type: string, enum: [community, category, department, channel] }
        permissions:
          type: array
          minItems: 1
          items: { type: string }
    CustomRole:
      type: object
      required: [key, label, description, scopeType, isActive, permissions, createdBy, createdAt, updatedAt]
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string }
        scopeType: { type: string, enum: [community, category, department, channel] }
        isActive: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomRoleCatalog:
      type: object
      required: [roles, permissions]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/CustomRole"
        permissions:
          type: array
          items:
            type: object
            required: [key, description]
            properties:
              key: { type: string }
              description: { type: string }
        pagination:
          type: object
          required: [nextCursor]
          properties:
            nextCursor: { type: ["string", "null"], description: Opaque cursor for the next role page, or null when complete. }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    IrcMessage:
      type: object
      properties:
        id:
          type: string
        channel:
          type: string
        nick:
          type: string
        text:
          type: string
        timestamp:
          type: string
          format: date-time
        kind:
          type: string
          enum: [message, system]
      required: [id, channel, nick, text, timestamp, kind]
    IrcUser:
      type: object
      properties:
        nick:
          type: string
        status:
          type: string
          enum: [online, away]
        color:
          type: string
      required: [nick, status, color]
    IrcState:
      type: object
      properties:
        channel:
          type: string
        topic:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/IrcMessage"
        users:
          type: array
          items:
            $ref: "#/components/schemas/IrcUser"
      required: [channel, topic, messages, users]
    IrcJoinInput:
      type: object
      properties:
        channel:
          type: string
          minLength: 1
        nick:
          type: string
          minLength: 1
          maxLength: 24
      required: [channel, nick]
    IrcMessageInput:
      type: object
      properties:
        channel:
          type: string
          minLength: 1
        nick:
          type: string
          minLength: 1
          maxLength: 24
        text:
          type: string
          minLength: 1
          maxLength: 500
      required: [channel, nick, text]
    OnboardingCommunity:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          enum: [free_community, paid_workspace]
        onboardingStep:
          type: integer
        joined:
          type: boolean
        canManage:
          type: boolean
      required: [id, name, slug, plan, onboardingStep, joined, canManage]
    OnboardingState:
      type: object
      properties:
        nextStep:
          type: string
          enum: [create, configure, invite, start]
        ownerCommunity:
          oneOf:
            - $ref: "#/components/schemas/OnboardingCommunity"
            - type: "null"
        communities:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingCommunity"
      required: [nextStep, ownerCommunity, communities]
    OnboardingProgressInput:
      type: object
      properties:
        step:
          type: integer
          enum: [2, 9]
      required: [step]
    OnboardingProgress:
      type: object
      properties:
        community:
          $ref: "#/components/schemas/OnboardingCommunity"
        nextStep:
          type: string
          enum: [create, configure, invite, start]
      required: [community, nextStep]
