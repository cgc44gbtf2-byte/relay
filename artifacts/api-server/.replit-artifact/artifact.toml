kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/api/ws"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# The release script uses &&, so the API starts only after migrations succeed.
args = ["pnpm", "run", "release:start"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
RELEASE_MIGRATION_TARGET = "production"
# Set these non-secret confirmations in production deployment settings for each release,
# after verifying a current backup or provider snapshot. Do not hard-code the reference.
# RELEASE_MIGRATION_BACKUP_CONFIRMED = "true"
# RELEASE_MIGRATION_BACKUP_REFERENCE = "<current-backup-or-snapshot-label>"
# For reviewed destructive migrations only, also set both destructive approval values.

[services.production.health.startup]
path = "/api/healthz"
